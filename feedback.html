<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Feedback | Human Mind Lab</title>
    <meta name="description" content="Share your feedback about Human Mind Lab.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
    <meta name="theme-color" content="#071126">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Feedback | Human Mind Lab">
    <meta property="og:description" content="Share your feedback about Human Mind Lab.">
    <link rel="stylesheet" href="style.css">

</head>


<body>
    <a class="skip-link" href="#main">Skip to main content</a>


    <header id="top">

        <h1>
            <span class="page-icon">📩</span> 
            <span class="page-title">Feedback</span>
        </h1>

        <p>
            Share your experience with Human Mind Lab.
        </p>

        <hr>


    </header>

    <!-- ================= NAVIGATION (sticky) ================= -->
    <nav>

            <a href="index.html">Home</a>
            <a href="brain.html">Brain Explorer</a>
            <a href="memory.html">Memory Lab</a>
            <a href="focus.html">Focus Lab</a>
            <a href="perception.html">Perception Lab</a>
            <a href="quiz.html">Brain Quiz</a>
            <a href="feedback.html" aria-current="page">Feedback</a>

        </nav>


    <hr>


    <main id="main">

        <section>

            <h2>Feedback Form</h2>

            <form>

                <fieldset>

                    <legend>
                        Personal Information
                    </legend>


                    <label for="name">
                        Name:
                    </label>

                    <br>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >

                    <br><br>


                    <label for="email">
                        Email:
                    </label>

                    <br>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                    >

                </fieldset>


                <br>


                <fieldset>

                    <legend>
                        Your Experience
                    </legend>


                    <label for="experience">
                        How was your experience?
                    </label>

                    <br><br>

                    <select
                        id="experience"
                        name="experience"
                        required>

                        <option value="">
                            Select an option
                        </option>

                        <option value="excellent">
                            Excellent
                        </option>

                        <option value="good">
                            Good
                        </option>

                        <option value="average">
                            Average
                        </option>

                        <option value="needs-improvement">
                            Needs Improvement
                        </option>

                    </select>


                    <br><br>


                    <label for="message">
                        Your feedback:
                    </label>

                    <br><br>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        cols="40"
                        placeholder="Write your feedback here"
                        required></textarea>

                </fieldset>


                <br>


                <button type="submit">
                    Submit Feedback
                </button>

                <button type="reset">
                    Clear Form
                </button>

            </form>

        </section>

    </main>


    <hr>


    <footer>

        <a href="index.html">
            ← Back to Home
        </a>

        <p>
            &copy; 2026 Human Mind Lab
        </p>

    </footer>

    <a href="#top" class="back-to-top" aria-label="Back to top">&uarr;</a>

</body>

</html>
