<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Feedback | Human Mind Lab</title>

</head>


<body>

    <header>

        <h1>📩 Feedback</h1>

        <p>
            Share your experience with Human Mind Lab.
        </p>

        <hr>

        <nav>

            <a href="index.html">Home</a> |
            <a href="brain.html">Brain Explorer</a> |
            <a href="memory.html">Memory Lab</a> |
            <a href="focus.html">Focus Lab</a> |
            <a href="perception.html">Perception Lab</a> |
            <a href="quiz.html">Brain Quiz</a> |
            <a href="learning.html">HTML Learning Lab</a> |
            <a href="feedback.html">Feedback</a>

        </nav>

    </header>


    <hr>


    <main>

        <section>

            <h2>Feedback Form</h2>

            <form>

                <fieldset>

                    <legend>
                        Personal Information
                    </legend>


                    <label for="name">
                        Name:
                    </label>

                    <br>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >

                    <br><br>


                    <label for="email">
                        Email:
                    </label>

                    <br>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                    >

                </fieldset>


                <br>


                <fieldset>

                    <legend>
                        Your Experience
                    </legend>


                    <label for="experience">
                        How was your experience?
                    </label>

                    <br><br>

                    <select
                        id="experience"
                        name="experience">

                        <option value="">
                            Select an option
                        </option>

                        <option value="excellent">
                            Excellent
                        </option>

                        <option value="good">
                            Good
                        </option>

                        <option value="average">
                            Average
                        </option>

                        <option value="needs-improvement">
                            Needs Improvement
                        </option>

                    </select>


                    <br><br>


                    <label for="message">
                        Your feedback:
                    </label>

                    <br><br>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        cols="40"
                        placeholder="Write your feedback here">
                    </textarea>

                </fieldset>


                <br>


                <button type="submit">
                    Submit Feedback
                </button>

                <button type="reset">
                    Clear Form
                </button>

            </form>

        </section>

    </main>


    <hr>


    <footer>

        <p>
            &copy; 2026 Human Mind Lab
        </p>

        <a href="index.html">
            ← Back to Home
        </a>

    </footer>

</body>

</html>
